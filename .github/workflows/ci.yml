# CI do ronin-api: lint, typecheck, testes (shared + API com PostgreSQL real), build e verificação
# do pacote @raphasparda/ronin-shared. Os E2E ficam no ronin-web (que sobe esta API).
# Detalhes, variáveis e como reproduzir localmente: docs/ops/ci.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo na mesma branch/PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nunca subir o PostgreSQL embutido (scripts/dev-db/postgres.mjs): o CI usa só o serviço abaixo.
  DEV_DB_EXTERNAL_ONLY: 'true'
  # Serviço postgres:18-alpine publicado na 5432 do runner. Credenciais descartáveis, só do CI.
  DATABASE_URL: postgres://ronin:ronin@127.0.0.1:5432/ronin
  TEST_DATABASE_URL: postgres://ronin:ronin@127.0.0.1:5432/ronin_test
  APP_ORIGIN: http://127.0.0.1:5310
  LOG_LEVEL: warn

jobs:
  checks:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ronin
          POSTGRES_PASSWORD: ronin
          POSTGRES_DB: ronin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ronin -d ronin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Sem `version`: usa o `packageManager` do package.json (pnpm@10.x).
      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node.js (.nvmrc) com cache do store do pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Criar banco de testes (ronin_test)
        run: docker exec "${{ job.services.postgres.id }}" psql -U ronin -d ronin -v ON_ERROR_STOP=1 -c "CREATE DATABASE ronin_test OWNER ronin"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes (shared + API)
        run: pnpm test

      - name: Build (dist do shared + API)
        run: pnpm build

      # Garante que o tarball publicável contém dist/ e nada de fonte ou testes.
      - name: Verificar pacote do shared
        run: |
          pnpm --filter "./packages/shared" pack --pack-destination "$RUNNER_TEMP/shared-pack"
          tar -tzf "$RUNNER_TEMP"/shared-pack/*.tgz | tee "$RUNNER_TEMP/shared-contents.txt"
          grep -qx 'package/dist/index.js' "$RUNNER_TEMP/shared-contents.txt"
          grep -qx 'package/dist/index.d.ts' "$RUNNER_TEMP/shared-contents.txt"
          if grep -E '^package/(src|test)/|\.test\.' "$RUNNER_TEMP/shared-contents.txt"; then
            echo "::error::O tarball do shared contém fonte ou testes."
            exit 1
          fi
