# Ambiente de desenvolvimento: só o PostgreSQL.
# Uso: pnpm db:up / pnpm db:down. Produção fica em infra/docker-compose.prod.yml (Fatia 10).
name: kanban

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      # Só na interface local: o banco de dev nunca fica exposto na rede.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # A imagem 18 guarda os dados em /var/lib/postgresql/18/docker; o volume monta o diretório pai.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanban -d kanban']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
